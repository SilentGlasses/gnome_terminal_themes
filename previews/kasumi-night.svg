<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#121617" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#121617"/>
  <rect x="0" y="26" width="700" height="10" fill="#121617"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#d6dad7" text-anchor="middle" opacity="0.7">Kasumi Night</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#d6dad7" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#d6dad7">
      <tspan x="0" y="20" fill="#5f7c74">❯</tspan>
      <tspan fill="#d6dad7"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#5f8a8a">OS</tspan>
      <tspan fill="#d6dad7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d6dad7">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#9a8a4a">⚙</tspan>
      <tspan fill="#d6dad7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d6dad7">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#6b5a7a">📦</tspan>
      <tspan fill="#d6dad7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d6dad7">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#8f3e3e">🐚</tspan>
      <tspan fill="#d6dad7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d6dad7">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#3f6272">🖥</tspan>
      <tspan fill="#d6dad7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d6dad7">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#5f7c74">🎨</tspan>
      <tspan fill="#d6dad7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d6dad7">Kasumi Night</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#1e2425"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#3f6272">function</tspan>
      <tspan fill="#9a8a4a"> greet</tspan>
      <tspan fill="#d6dad7">() {</tspan>
      <tspan x="0" y="244" fill="#d6dad7">    </tspan>
      <tspan fill="#3f6272">echo</tspan>
      <tspan fill="#d6dad7"> </tspan>
      <tspan fill="#5f7c74">"Hello, </tspan>
      <tspan fill="#5f8a8a">$USER</tspan>
      <tspan fill="#5f7c74">!"</tspan>
      <tspan x="0" y="266" fill="#d6dad7">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#d6dad7" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#121617" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#8f3e3e" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#5f7c74" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#9a8a4a" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#3f6272" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#6b5a7a" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#5f8a8a" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#cfd4d1" stroke="#d6dad7" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#d6dad7" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#1e2425" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#b35a5a" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#7fa59b" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#c4b36a" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#5f8aa3" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#9073ad" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#7fbfb8" stroke="#d6dad7" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f2f4f3" stroke="#d6dad7" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>