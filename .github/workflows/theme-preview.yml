name: Theme Preview Generator

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'themes/*.sh'
  push:
    branches: [main]
    paths:
      - 'themes/*.sh'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-previews:
    name: Generate Theme Previews
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate all previews and update README
        run: |
          python3 .github/scripts/generate_preview.py --all --update-readme

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: theme-previews
          path: previews/*.svg
          if-no-files-found: ignore

      # On push to main, commit the changes
      - name: Commit preview updates
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previews/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update theme previews

            Co-Authored-By: Warp <agent@warp.dev>"
            git push
          fi

      # On PR, comment with preview of changed themes
      - name: Get changed theme files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'themes/*.sh' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Comment on PR with previews
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Get changed files
            const changedFiles = '${{ steps.changed.outputs.files }}'.trim().split(' ').filter(f => f);
            const changedSlugs = changedFiles.map(f => path.basename(f, '.sh'));

            const previewDir = 'previews';
            let comment = '## 🎨 Theme Preview\n\n';
            comment += 'Previews for changed themes in this PR:\n\n';

            if (fs.existsSync(previewDir)) {
              for (const slug of changedSlugs) {
                const file = `${slug}.svg`;
                const filePath = path.join(previewDir, file);

                if (fs.existsSync(filePath)) {
                  const themeName = slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                  const svgContent = fs.readFileSync(filePath, 'utf8');
                  const base64 = Buffer.from(svgContent).toString('base64');

                  comment += `### ${themeName}\n`;
                  comment += `![${themeName}](data:image/svg+xml;base64,${base64})\n\n`;
                }
              }

              comment += '\n<details>\n<summary>ℹ️ About previews</summary>\n\n';
              comment += 'These previews are auto-generated and show how the theme colors will appear in GNOME Terminal.\n';
              comment += 'Once merged, previews will be committed to the `previews/` folder and added to the README.\n';
              comment += '</details>';
            } else {
              comment += 'No preview files found.';
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## 🎨 Theme Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
