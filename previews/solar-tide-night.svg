<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#0e1a22" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#0e1a22"/>
  <rect x="0" y="26" width="700" height="10" fill="#0e1a22"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#eef6fb" text-anchor="middle" opacity="0.7">Solar Tide Night</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#eef6fb" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#eef6fb">
      <tspan x="0" y="20" fill="#7fd1a1">❯</tspan>
      <tspan fill="#eef6fb"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#5fd3c6">OS</tspan>
      <tspan fill="#eef6fb" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eef6fb">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#ffd166">⚙</tspan>
      <tspan fill="#eef6fb" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eef6fb">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#c38bd6">📦</tspan>
      <tspan fill="#eef6fb" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eef6fb">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#ff7a5c">🐚</tspan>
      <tspan fill="#eef6fb" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eef6fb">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#5fa8d3">🖥</tspan>
      <tspan fill="#eef6fb" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eef6fb">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#7fd1a1">🎨</tspan>
      <tspan fill="#eef6fb" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eef6fb">Solar Tide Night</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#1f3442"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#5fa8d3">function</tspan>
      <tspan fill="#ffd166"> greet</tspan>
      <tspan fill="#eef6fb">() {</tspan>
      <tspan x="0" y="244" fill="#eef6fb">    </tspan>
      <tspan fill="#5fa8d3">echo</tspan>
      <tspan fill="#eef6fb"> </tspan>
      <tspan fill="#7fd1a1">"Hello, </tspan>
      <tspan fill="#5fd3c6">$USER</tspan>
      <tspan fill="#7fd1a1">!"</tspan>
      <tspan x="0" y="266" fill="#eef6fb">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#eef6fb" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#0e1a22" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff7a5c" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#7fd1a1" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffd166" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#5fa8d3" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#c38bd6" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#5fd3c6" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#dceaf2" stroke="#eef6fb" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#eef6fb" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#1f3442" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff9a82" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#9fe6bb" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffe08a" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#7fc2e8" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#ddb3ef" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#7ff0e0" stroke="#eef6fb" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#eef6fb" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>