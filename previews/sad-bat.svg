<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#1e2026" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#1e2026"/>
  <rect x="0" y="26" width="700" height="10" fill="#1e2026"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#b4bed2" text-anchor="middle" opacity="0.7">Sad Bat</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#b4bed2" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#b4bed2">
      <tspan x="0" y="20" fill="#5aa05f">❯</tspan>
      <tspan fill="#b4bed2"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#96b9cd">OS</tspan>
      <tspan fill="#b4bed2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4bed2">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#d2d76e">⚙</tspan>
      <tspan fill="#b4bed2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4bed2">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#b464f0">📦</tspan>
      <tspan fill="#b4bed2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4bed2">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#c86464">🐚</tspan>
      <tspan fill="#b4bed2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4bed2">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#8291d2">🖥</tspan>
      <tspan fill="#b4bed2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4bed2">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#5aa05f">🎨</tspan>
      <tspan fill="#b4bed2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4bed2">Sad Bat</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#464b55"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#8291d2">function</tspan>
      <tspan fill="#d2d76e"> greet</tspan>
      <tspan fill="#b4bed2">() {</tspan>
      <tspan x="0" y="244" fill="#b4bed2">    </tspan>
      <tspan fill="#8291d2">echo</tspan>
      <tspan fill="#b4bed2"> </tspan>
      <tspan fill="#5aa05f">"Hello, </tspan>
      <tspan fill="#96b9cd">$USER</tspan>
      <tspan fill="#5aa05f">!"</tspan>
      <tspan x="0" y="266" fill="#b4bed2">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#b4bed2" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#2d3037" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#c86464" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#5aa05f" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#d2d76e" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#8291d2" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#b464f0" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#96b9cd" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e6e8ee" stroke="#b4bed2" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#b4bed2" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#464b55" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#e68282" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#78be7d" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ebf08c" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#a0afeb" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#d28cff" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#b4d2e6" stroke="#b4bed2" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f5f7fc" stroke="#b4bed2" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>