<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#222433" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#222433"/>
  <rect x="0" y="26" width="700" height="10" fill="#222433"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#d7eff7" text-anchor="middle" opacity="0.7">Taken Will</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#d7eff7" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#d7eff7">
      <tspan x="0" y="20" fill="#55767d">❯</tspan>
      <tspan fill="#d7eff7"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#b2c8d1">OS</tspan>
      <tspan fill="#d7eff7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d7eff7">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#8397a0">⚙</tspan>
      <tspan fill="#d7eff7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d7eff7">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#48525d">📦</tspan>
      <tspan fill="#d7eff7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d7eff7">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#303f4f">🐚</tspan>
      <tspan fill="#d7eff7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d7eff7">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#2b4653">🖥</tspan>
      <tspan fill="#d7eff7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d7eff7">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#55767d">🎨</tspan>
      <tspan fill="#d7eff7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#d7eff7">Taken Will</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#5a6978"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#2b4653">function</tspan>
      <tspan fill="#8397a0"> greet</tspan>
      <tspan fill="#d7eff7">() {</tspan>
      <tspan x="0" y="244" fill="#d7eff7">    </tspan>
      <tspan fill="#2b4653">echo</tspan>
      <tspan fill="#d7eff7"> </tspan>
      <tspan fill="#55767d">"Hello, </tspan>
      <tspan fill="#b2c8d1">$USER</tspan>
      <tspan fill="#55767d">!"</tspan>
      <tspan x="0" y="266" fill="#d7eff7">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#d7eff7" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#060c14" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#303f4f" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#55767d" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#8397a0" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#2b4653" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#48525d" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#b2c8d1" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e7f9ff" stroke="#d7eff7" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#d7eff7" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#5a6978" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#506478" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#789ba5" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#a5bec8" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#506e82" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#6e7d8c" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#cde1eb" stroke="#d7eff7" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f5ffff" stroke="#d7eff7" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>