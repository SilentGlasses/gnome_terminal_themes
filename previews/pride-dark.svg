<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#231f1f" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#231f1f"/>
  <rect x="0" y="26" width="700" height="10" fill="#231f1f"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#ffa8c5" text-anchor="middle" opacity="0.7">Pride Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#ffa8c5" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#ffa8c5">
      <tspan x="0" y="20" fill="#23b14d">❯</tspan>
      <tspan fill="#ffa8c5"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#6ddada">OS</tspan>
      <tspan fill="#ffa8c5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#ffa8c5">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#e7dc00">⚙</tspan>
      <tspan fill="#ffa8c5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#ffa8c5">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#8c3d8c">📦</tspan>
      <tspan fill="#ffa8c5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#ffa8c5">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#ed1b24">🐚</tspan>
      <tspan fill="#ffa8c5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#ffa8c5">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#1617ff">🖥</tspan>
      <tspan fill="#ffa8c5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#ffa8c5">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#23b14d">🎨</tspan>
      <tspan fill="#ffa8c5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#ffa8c5">Pride Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#7b4d33"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#1617ff">function</tspan>
      <tspan fill="#e7dc00"> greet</tspan>
      <tspan fill="#ffa8c5">() {</tspan>
      <tspan x="0" y="244" fill="#ffa8c5">    </tspan>
      <tspan fill="#1617ff">echo</tspan>
      <tspan fill="#ffa8c5"> </tspan>
      <tspan fill="#23b14d">"Hello, </tspan>
      <tspan fill="#6ddada">$USER</tspan>
      <tspan fill="#23b14d">!"</tspan>
      <tspan x="0" y="266" fill="#ffa8c5">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#ffa8c5" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#7b4d33" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ed1b24" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#23b14d" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#e7dc00" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#1617ff" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#8c3d8c" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#6ddada" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e5e5e5" stroke="#ffa8c5" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#ffa8c5" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#7b4d33" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#f34343" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#17c34b" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#fef200" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#4343ff" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#8c3d8c" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#76eded" stroke="#ffa8c5" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#ffa8c5" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>