<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#000000" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#000000"/>
  <rect x="0" y="26" width="700" height="10" fill="#000000"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#8fd7b9" text-anchor="middle" opacity="0.7">White Rabbit Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#8fd7b9" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#8fd7b9">
      <tspan x="0" y="20" fill="#005f0f">❯</tspan>
      <tspan fill="#8fd7b9"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#00b733">OS</tspan>
      <tspan fill="#8fd7b9" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#8fd7b9">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#007a1f">⚙</tspan>
      <tspan fill="#8fd7b9" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#8fd7b9">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#00a321">📦</tspan>
      <tspan fill="#8fd7b9" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#8fd7b9">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#003d1a">🐚</tspan>
      <tspan fill="#8fd7b9" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#8fd7b9">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#008f11">🖥</tspan>
      <tspan fill="#8fd7b9" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#8fd7b9">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#005f0f">🎨</tspan>
      <tspan fill="#8fd7b9" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#8fd7b9">White Rabbit Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#00e64d"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#008f11">function</tspan>
      <tspan fill="#007a1f"> greet</tspan>
      <tspan fill="#8fd7b9">() {</tspan>
      <tspan x="0" y="244" fill="#8fd7b9">    </tspan>
      <tspan fill="#008f11">echo</tspan>
      <tspan fill="#8fd7b9"> </tspan>
      <tspan fill="#005f0f">"Hello, </tspan>
      <tspan fill="#00b733">$USER</tspan>
      <tspan fill="#005f0f">!"</tspan>
      <tspan x="0" y="266" fill="#8fd7b9">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#8fd7b9" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#001a0e" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#003d1a" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#005f0f" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#007a1f" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#008f11" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#00a321" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#00b733" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#00cc44" stroke="#8fd7b9" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#8fd7b9" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#00e64d" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#00ff41" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#33ff33" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#5cff5c" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#7fff7f" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#a3ffa3" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#ccffcc" stroke="#8fd7b9" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e6ffe6" stroke="#8fd7b9" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>