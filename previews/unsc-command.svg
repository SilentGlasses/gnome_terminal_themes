<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#0b1620" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#0b1620"/>
  <rect x="0" y="26" width="700" height="10" fill="#0b1620"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#dce7f2" text-anchor="middle" opacity="0.7">UNSC Command</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#dce7f2" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#dce7f2">
      <tspan x="0" y="20" fill="#4caf50">❯</tspan>
      <tspan fill="#dce7f2"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#4fb3b3">OS</tspan>
      <tspan fill="#dce7f2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dce7f2">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#d6b65c">⚙</tspan>
      <tspan fill="#dce7f2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dce7f2">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#8c6fd1">📦</tspan>
      <tspan fill="#dce7f2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dce7f2">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#c94a4a">🐚</tspan>
      <tspan fill="#dce7f2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dce7f2">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#4da6ff">🖥</tspan>
      <tspan fill="#dce7f2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dce7f2">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#4caf50">🎨</tspan>
      <tspan fill="#dce7f2" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dce7f2">UNSC Command</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#1c2a36"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#4da6ff">function</tspan>
      <tspan fill="#d6b65c"> greet</tspan>
      <tspan fill="#dce7f2">() {</tspan>
      <tspan x="0" y="244" fill="#dce7f2">    </tspan>
      <tspan fill="#4da6ff">echo</tspan>
      <tspan fill="#dce7f2"> </tspan>
      <tspan fill="#4caf50">"Hello, </tspan>
      <tspan fill="#4fb3b3">$USER</tspan>
      <tspan fill="#4caf50">!"</tspan>
      <tspan x="0" y="266" fill="#dce7f2">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#dce7f2" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#0b1620" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#c94a4a" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#4caf50" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#d6b65c" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#4da6ff" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#8c6fd1" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#4fb3b3" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#dce7f2" stroke="#dce7f2" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#dce7f2" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#1c2a36" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#e57373" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#81c784" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffd54f" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#82b8ff" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#b39ddb" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#80deea" stroke="#dce7f2" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#dce7f2" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>