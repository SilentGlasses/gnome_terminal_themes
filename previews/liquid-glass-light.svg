<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#f8f8fc" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#f8f8fc"/>
  <rect x="0" y="26" width="700" height="10" fill="#f8f8fc"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#282832" text-anchor="middle" opacity="0.7">Liquid Glass Light</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#282832" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#282832">
      <tspan x="0" y="20" fill="#32a550">❯</tspan>
      <tspan fill="#282832"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#2d9baf">OS</tspan>
      <tspan fill="#282832" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#282832">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#b98c1e">⚙</tspan>
      <tspan fill="#282832" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#282832">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#a05ab4">📦</tspan>
      <tspan fill="#282832" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#282832">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#d74b46">🐚</tspan>
      <tspan fill="#282832" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#282832">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#3278c8">🖥</tspan>
      <tspan fill="#282832" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#282832">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#32a550">🎨</tspan>
      <tspan fill="#282832" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#282832">Liquid Glass Light</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#646473"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#3278c8">function</tspan>
      <tspan fill="#b98c1e"> greet</tspan>
      <tspan fill="#282832">() {</tspan>
      <tspan x="0" y="244" fill="#282832">    </tspan>
      <tspan fill="#3278c8">echo</tspan>
      <tspan fill="#282832"> </tspan>
      <tspan fill="#32a550">"Hello, </tspan>
      <tspan fill="#2d9baf">$USER</tspan>
      <tspan fill="#32a550">!"</tspan>
      <tspan x="0" y="266" fill="#282832">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#282832" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#3c3c4b" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#d74b46" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#32a550" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#b98c1e" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#3278c8" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#a05ab4" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#2d9baf" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#828291" stroke="#282832" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#282832" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#646473" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#eb645f" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#46be69" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#d2a532" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#5096e6" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#be78d2" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#46b4c8" stroke="#282832" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#b4b4c3" stroke="#282832" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>