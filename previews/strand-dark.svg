<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#0a120f" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#0a120f"/>
  <rect x="0" y="26" width="700" height="10" fill="#0a120f"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#b4ebc7" text-anchor="middle" opacity="0.7">Strand Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#b4ebc7" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#b4ebc7">
      <tspan x="0" y="20" fill="#00ff9f">❯</tspan>
      <tspan fill="#b4ebc7"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#00ebc7">OS</tspan>
      <tspan fill="#b4ebc7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4ebc7">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#ebff1f">⚙</tspan>
      <tspan fill="#b4ebc7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4ebc7">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#c700eb">📦</tspan>
      <tspan fill="#b4ebc7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4ebc7">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#ff657a">🐚</tspan>
      <tspan fill="#b4ebc7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4ebc7">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#00c7eb">🖥</tspan>
      <tspan fill="#b4ebc7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4ebc7">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#00ff9f">🎨</tspan>
      <tspan fill="#b4ebc7" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#b4ebc7">Strand Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#465f50"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#00c7eb">function</tspan>
      <tspan fill="#ebff1f"> greet</tspan>
      <tspan fill="#b4ebc7">() {</tspan>
      <tspan x="0" y="244" fill="#b4ebc7">    </tspan>
      <tspan fill="#00c7eb">echo</tspan>
      <tspan fill="#b4ebc7"> </tspan>
      <tspan fill="#00ff9f">"Hello, </tspan>
      <tspan fill="#00ebc7">$USER</tspan>
      <tspan fill="#00ff9f">!"</tspan>
      <tspan x="0" y="266" fill="#b4ebc7">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#b4ebc7" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#0a120f" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff657a" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#00ff9f" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ebff1f" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#00c7eb" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#c700eb" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#00ebc7" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#b4ebc7" stroke="#b4ebc7" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#b4ebc7" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#465f50" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff859a" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#20ffaf" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ebff3f" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#20d7fb" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#d710fb" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#20fbd7" stroke="#b4ebc7" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#d4fbe7" stroke="#b4ebc7" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>