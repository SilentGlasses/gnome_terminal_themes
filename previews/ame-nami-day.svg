<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#eef4f5" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#eef4f5"/>
  <rect x="0" y="26" width="700" height="10" fill="#eef4f5"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#243236" text-anchor="middle" opacity="0.7">Ame-Nami Day</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#243236" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#243236">
      <tspan x="0" y="20" fill="#5f8f7f">❯</tspan>
      <tspan fill="#243236"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#4fa3b3">OS</tspan>
      <tspan fill="#243236" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#243236">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#bfa35f">⚙</tspan>
      <tspan fill="#243236" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#243236">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#7f5f9f">📦</tspan>
      <tspan fill="#243236" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#243236">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#a84a4a">🐚</tspan>
      <tspan fill="#243236" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#243236">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#2f6fa3">🖥</tspan>
      <tspan fill="#243236" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#243236">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#5f8f7f">🎨</tspan>
      <tspan fill="#243236" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#243236">Ame-Nami Day</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#425a63"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#2f6fa3">function</tspan>
      <tspan fill="#bfa35f"> greet</tspan>
      <tspan fill="#243236">() {</tspan>
      <tspan x="0" y="244" fill="#243236">    </tspan>
      <tspan fill="#2f6fa3">echo</tspan>
      <tspan fill="#243236"> </tspan>
      <tspan fill="#5f8f7f">"Hello, </tspan>
      <tspan fill="#4fa3b3">$USER</tspan>
      <tspan fill="#5f8f7f">!"</tspan>
      <tspan x="0" y="266" fill="#243236">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#243236" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#243236" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#a84a4a" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#5f8f7f" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#bfa35f" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#2f6fa3" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#7f5f9f" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#4fa3b3" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e4eded" stroke="#243236" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#243236" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#425a63" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#cc6a6a" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#7fb3a3" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#e0c98a" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#5fa7e0" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#a88fd4" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#7fd4e0" stroke="#243236" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#243236" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>