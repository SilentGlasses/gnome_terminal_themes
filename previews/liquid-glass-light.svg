<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#ffffff"/>
  <rect x="0" y="26" width="700" height="10" fill="#ffffff"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#1c1e21" text-anchor="middle" opacity="0.7">Liquid Glass Light</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#1c1e21" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#1c1e21">
      <tspan x="0" y="20" fill="#00a600">❯</tspan>
      <tspan fill="#1c1e21"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#00a6b2">OS</tspan>
      <tspan fill="#1c1e21" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1c1e21">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#999900">⚙</tspan>
      <tspan fill="#1c1e21" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1c1e21">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#b200b2">📦</tspan>
      <tspan fill="#1c1e21" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1c1e21">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#990100">🐚</tspan>
      <tspan fill="#1c1e21" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1c1e21">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#0200b2">🖥</tspan>
      <tspan fill="#1c1e21" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1c1e21">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#00a600">🎨</tspan>
      <tspan fill="#1c1e21" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1c1e21">Liquid Glass Light</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#666666"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#0200b2">function</tspan>
      <tspan fill="#999900"> greet</tspan>
      <tspan fill="#1c1e21">() {</tspan>
      <tspan x="0" y="244" fill="#1c1e21">    </tspan>
      <tspan fill="#0200b2">echo</tspan>
      <tspan fill="#1c1e21"> </tspan>
      <tspan fill="#00a600">"Hello, </tspan>
      <tspan fill="#00a6b2">$USER</tspan>
      <tspan fill="#00a600">!"</tspan>
      <tspan x="0" y="266" fill="#1c1e21">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#1c1e21" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#000000" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#990100" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#00a600" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#999900" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#0200b2" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#b200b2" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#00a6b2" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f4f8f0" stroke="#1c1e21" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#1c1e21" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#666666" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#e60300" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#00d900" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#e6e500" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#0600ff" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#e600e6" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#00e6e6" stroke="#1c1e21" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f4f8f0" stroke="#1c1e21" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>