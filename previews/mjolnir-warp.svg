<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#2c2e2a" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#2c2e2a"/>
  <rect x="0" y="26" width="700" height="10" fill="#2c2e2a"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#cdcfcc" text-anchor="middle" opacity="0.7">Mjolnir Warp</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#cdcfcc" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#cdcfcc">
      <tspan x="0" y="20" fill="#84926a">❯</tspan>
      <tspan fill="#cdcfcc"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#97dfe1">OS</tspan>
      <tspan fill="#cdcfcc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#cdcfcc">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#efb82a">⚙</tspan>
      <tspan fill="#cdcfcc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#cdcfcc">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#776ba7">📦</tspan>
      <tspan fill="#cdcfcc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#cdcfcc">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#843d3e">🐚</tspan>
      <tspan fill="#cdcfcc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#cdcfcc">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#6e92c8">🖥</tspan>
      <tspan fill="#cdcfcc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#cdcfcc">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#84926a">🎨</tspan>
      <tspan fill="#cdcfcc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#cdcfcc">Mjolnir Warp</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#64645f"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#6e92c8">function</tspan>
      <tspan fill="#efb82a"> greet</tspan>
      <tspan fill="#cdcfcc">() {</tspan>
      <tspan x="0" y="244" fill="#cdcfcc">    </tspan>
      <tspan fill="#6e92c8">echo</tspan>
      <tspan fill="#cdcfcc"> </tspan>
      <tspan fill="#84926a">"Hello, </tspan>
      <tspan fill="#97dfe1">$USER</tspan>
      <tspan fill="#84926a">!"</tspan>
      <tspan x="0" y="266" fill="#cdcfcc">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#cdcfcc" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#0d090d" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#843d3e" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#84926a" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#efb82a" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#6e92c8" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#776ba7" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#97dfe1" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#cdcfcc" stroke="#cdcfcc" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#cdcfcc" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#64645f" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#a55f5f" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#a0af87" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#facd50" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#8cafe1" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#968cc3" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#b4f0f2" stroke="#cdcfcc" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e6e8e6" stroke="#cdcfcc" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>