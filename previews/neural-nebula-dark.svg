<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#0f111a" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#0f111a"/>
  <rect x="0" y="26" width="700" height="10" fill="#0f111a"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#eceff4" text-anchor="middle" opacity="0.7">Neural Nebula Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#eceff4" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#eceff4">
      <tspan x="0" y="20" fill="#a3be8c">❯</tspan>
      <tspan fill="#eceff4"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#8fbcbb">OS</tspan>
      <tspan fill="#eceff4" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eceff4">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#ebcb8b">⚙</tspan>
      <tspan fill="#eceff4" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eceff4">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#b48ead">📦</tspan>
      <tspan fill="#eceff4" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eceff4">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#bf616a">🐚</tspan>
      <tspan fill="#eceff4" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eceff4">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#81a1c1">🖥</tspan>
      <tspan fill="#eceff4" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eceff4">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#a3be8c">🎨</tspan>
      <tspan fill="#eceff4" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#eceff4">Neural Nebula Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#3b4252"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#81a1c1">function</tspan>
      <tspan fill="#ebcb8b"> greet</tspan>
      <tspan fill="#eceff4">() {</tspan>
      <tspan x="0" y="244" fill="#eceff4">    </tspan>
      <tspan fill="#81a1c1">echo</tspan>
      <tspan fill="#eceff4"> </tspan>
      <tspan fill="#a3be8c">"Hello, </tspan>
      <tspan fill="#8fbcbb">$USER</tspan>
      <tspan fill="#a3be8c">!"</tspan>
      <tspan x="0" y="266" fill="#eceff4">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#eceff4" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#2e3440" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#bf616a" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#a3be8c" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ebcb8b" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#81a1c1" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#b48ead" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#8fbcbb" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#d8dee9" stroke="#eceff4" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#eceff4" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#3b4252" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#d08770" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#b1d196" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#f0d399" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#88c0d0" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#d6b4e1" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#93e0e5" stroke="#eceff4" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#eceff4" stroke="#eceff4" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>