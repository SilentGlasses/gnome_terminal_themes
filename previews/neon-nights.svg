<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#231f20" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#231f20"/>
  <rect x="0" y="26" width="700" height="10" fill="#231f20"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#e5e9f0" text-anchor="middle" opacity="0.7">Neon Nights</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#e5e9f0" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#e5e9f0">
      <tspan x="0" y="20" fill="#00ed04">❯</tspan>
      <tspan fill="#e5e9f0"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#00e1f1">OS</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#f2f200">⚙</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#f400f4">📦</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#ea0014">🐚</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#00b5ec">🖥</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#00ed04">🎨</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">Neon Nights</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#090909"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#00b5ec">function</tspan>
      <tspan fill="#f2f200"> greet</tspan>
      <tspan fill="#e5e9f0">() {</tspan>
      <tspan x="0" y="244" fill="#e5e9f0">    </tspan>
      <tspan fill="#00b5ec">echo</tspan>
      <tspan fill="#e5e9f0"> </tspan>
      <tspan fill="#00ed04">"Hello, </tspan>
      <tspan fill="#00e1f1">$USER</tspan>
      <tspan fill="#00ed04">!"</tspan>
      <tspan x="0" y="266" fill="#e5e9f0">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#e5e9f0" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#1c0b1d" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ea0014" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#00ed04" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#f2f200" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#00b5ec" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#f400f4" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#00e1f1" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#eeeeee" stroke="#e5e9f0" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#e5e9f0" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#090909" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff004d" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#00ff0d" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#f1ff00" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#00c8ff" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#ff00fb" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#00f7ff" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#e5e9f0" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>