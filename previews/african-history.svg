<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#201c1d" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#201c1d"/>
  <rect x="0" y="26" width="700" height="10" fill="#201c1d"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#dcc3af" text-anchor="middle" opacity="0.7">African History</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#dcc3af" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#dcc3af">
      <tspan x="0" y="20" fill="#5fa578">❯</tspan>
      <tspan fill="#dcc3af"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#73aaaa">OS</tspan>
      <tspan fill="#dcc3af" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcc3af">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#f0cd46">⚙</tspan>
      <tspan fill="#dcc3af" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcc3af">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#8c78aa">📦</tspan>
      <tspan fill="#dcc3af" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcc3af">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#d76e5a">🐚</tspan>
      <tspan fill="#dcc3af" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcc3af">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#558cbe">🖥</tspan>
      <tspan fill="#dcc3af" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcc3af">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#5fa578">🎨</tspan>
      <tspan fill="#dcc3af" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcc3af">African History</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#504844"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#558cbe">function</tspan>
      <tspan fill="#f0cd46"> greet</tspan>
      <tspan fill="#dcc3af">() {</tspan>
      <tspan x="0" y="244" fill="#dcc3af">    </tspan>
      <tspan fill="#558cbe">echo</tspan>
      <tspan fill="#dcc3af"> </tspan>
      <tspan fill="#5fa578">"Hello, </tspan>
      <tspan fill="#73aaaa">$USER</tspan>
      <tspan fill="#5fa578">!"</tspan>
      <tspan x="0" y="266" fill="#dcc3af">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#dcc3af" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#322d2a" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#d76e5a" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#5fa578" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#f0cd46" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#558cbe" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#8c78aa" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#73aaaa" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f5f0eb" stroke="#dcc3af" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#dcc3af" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#504844" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#eb8773" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#7dbe91" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#fadc64" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#78aad7" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#af9bc8" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#96c8c8" stroke="#dcc3af" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#fffaf5" stroke="#dcc3af" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>