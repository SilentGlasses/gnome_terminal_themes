<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#f4f1ea" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#f4f1ea"/>
  <rect x="0" y="26" width="700" height="10" fill="#f4f1ea"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#2a2f2e" text-anchor="middle" opacity="0.7">Ukiyo Day</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#2a2f2e" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#2a2f2e">
      <tspan x="0" y="20" fill="#6b8f71">❯</tspan>
      <tspan fill="#2a2f2e"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#5f8f8a">OS</tspan>
      <tspan fill="#2a2f2e" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#2a2f2e">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#b89b4a">⚙</tspan>
      <tspan fill="#2a2f2e" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#2a2f2e">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#7b5a8f">📦</tspan>
      <tspan fill="#2a2f2e" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#2a2f2e">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#a2433d">🐚</tspan>
      <tspan fill="#2a2f2e" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#2a2f2e">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#3a6f8f">🖥</tspan>
      <tspan fill="#2a2f2e" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#2a2f2e">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#6b8f71">🎨</tspan>
      <tspan fill="#2a2f2e" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#2a2f2e">Ukiyo Day</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#4a504e"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#3a6f8f">function</tspan>
      <tspan fill="#b89b4a"> greet</tspan>
      <tspan fill="#2a2f2e">() {</tspan>
      <tspan x="0" y="244" fill="#2a2f2e">    </tspan>
      <tspan fill="#3a6f8f">echo</tspan>
      <tspan fill="#2a2f2e"> </tspan>
      <tspan fill="#6b8f71">"Hello, </tspan>
      <tspan fill="#5f8f8a">$USER</tspan>
      <tspan fill="#6b8f71">!"</tspan>
      <tspan x="0" y="266" fill="#2a2f2e">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#2a2f2e" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#2a2f2e" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#a2433d" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#6b8f71" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#b89b4a" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#3a6f8f" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#7b5a8f" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#5f8f8a" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e8e5dc" stroke="#2a2f2e" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#2a2f2e" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#4a504e" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#c05a52" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#89b39a" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#d9c37a" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#5f93b8" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#a47fc2" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#7fc2bb" stroke="#2a2f2e" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#2a2f2e" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>