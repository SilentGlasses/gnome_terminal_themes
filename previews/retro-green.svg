<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#13241b" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#13241b"/>
  <rect x="0" y="26" width="700" height="10" fill="#13241b"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#1ed174" text-anchor="middle" opacity="0.7">Retro Green</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#1ed174" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#1ed174">
      <tspan x="0" y="20" fill="#20b96c">❯</tspan>
      <tspan fill="#1ed174"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#1db267">OS</tspan>
      <tspan fill="#1ed174" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1ed174">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#24ea8f">⚙</tspan>
      <tspan fill="#1ed174" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1ed174">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#1c834f">📦</tspan>
      <tspan fill="#1ed174" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1ed174">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#1c7f4c">🐚</tspan>
      <tspan fill="#1ed174" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1ed174">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#1e9358">🖥</tspan>
      <tspan fill="#1ed174" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1ed174">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#20b96c">🎨</tspan>
      <tspan fill="#1ed174" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#1ed174">Retro Green</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#37644b"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#1e9358">function</tspan>
      <tspan fill="#24ea8f"> greet</tspan>
      <tspan fill="#1ed174">() {</tspan>
      <tspan x="0" y="244" fill="#1ed174">    </tspan>
      <tspan fill="#1e9358">echo</tspan>
      <tspan fill="#1ed174"> </tspan>
      <tspan fill="#20b96c">"Hello, </tspan>
      <tspan fill="#1db267">$USER</tspan>
      <tspan fill="#20b96c">!"</tspan>
      <tspan x="0" y="266" fill="#1ed174">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#1ed174" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#183024" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#1c7f4c" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#20b96c" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#24ea8f" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#1e9358" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#1c834f" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#1db267" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#1ed174" stroke="#1ed174" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#1ed174" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#37644b" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#3ca069" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#46d78c" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#50ffaf" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#41b478" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#3ca56e" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#41d287" stroke="#1ed174" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#46f096" stroke="#1ed174" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>