<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#303030" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#303030"/>
  <rect x="0" y="26" width="700" height="10" fill="#303030"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#f1f1f1" text-anchor="middle" opacity="0.7">Lapiz Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#f1f1f1" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#f1f1f1">
      <tspan x="0" y="20" fill="#7eaf8d">❯</tspan>
      <tspan fill="#f1f1f1"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#7cb0c3">OS</tspan>
      <tspan fill="#f1f1f1" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f1f1f1">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#eee359">⚙</tspan>
      <tspan fill="#f1f1f1" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f1f1f1">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#615488">📦</tspan>
      <tspan fill="#f1f1f1" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f1f1f1">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#b25282">🐚</tspan>
      <tspan fill="#f1f1f1" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f1f1f1">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#6e9ecb">🖥</tspan>
      <tspan fill="#f1f1f1" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f1f1f1">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#7eaf8d">🎨</tspan>
      <tspan fill="#f1f1f1" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f1f1f1">Lapiz Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#303030"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#6e9ecb">function</tspan>
      <tspan fill="#eee359"> greet</tspan>
      <tspan fill="#f1f1f1">() {</tspan>
      <tspan x="0" y="244" fill="#f1f1f1">    </tspan>
      <tspan fill="#6e9ecb">echo</tspan>
      <tspan fill="#f1f1f1"> </tspan>
      <tspan fill="#7eaf8d">"Hello, </tspan>
      <tspan fill="#7cb0c3">$USER</tspan>
      <tspan fill="#7eaf8d">!"</tspan>
      <tspan x="0" y="266" fill="#f1f1f1">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#f1f1f1" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#303030" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#b25282" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#7eaf8d" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#eee359" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#6e9ecb" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#615488" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#7cb0c3" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f3f3f1" stroke="#f1f1f1" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#f1f1f1" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#303030" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#b25282" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#7eaf8d" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#eee359" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#6e9ecb" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#615488" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#7cb0c3" stroke="#f1f1f1" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f3f3f1" stroke="#f1f1f1" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>