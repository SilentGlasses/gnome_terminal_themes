<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#2a2a2a" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#2a2a2a"/>
  <rect x="0" y="26" width="700" height="10" fill="#2a2a2a"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#fefefe" text-anchor="middle" opacity="0.7">Tabs Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#fefefe" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#fefefe">
      <tspan x="0" y="20" fill="#17a278">❯</tspan>
      <tspan fill="#fefefe"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#469daf">OS</tspan>
      <tspan fill="#fefefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fefefe">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#a89a16">⚙</tspan>
      <tspan fill="#fefefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fefefe">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#58437a">📦</tspan>
      <tspan fill="#fefefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fefefe">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#b60c70">🐚</tspan>
      <tspan fill="#fefefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fefefe">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#068abb">🖥</tspan>
      <tspan fill="#fefefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fefefe">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#17a278">🎨</tspan>
      <tspan fill="#fefefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fefefe">Tabs Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#000000"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#068abb">function</tspan>
      <tspan fill="#a89a16"> greet</tspan>
      <tspan fill="#fefefe">() {</tspan>
      <tspan x="0" y="244" fill="#fefefe">    </tspan>
      <tspan fill="#068abb">echo</tspan>
      <tspan fill="#fefefe"> </tspan>
      <tspan fill="#17a278">"Hello, </tspan>
      <tspan fill="#469daf">$USER</tspan>
      <tspan fill="#17a278">!"</tspan>
      <tspan x="0" y="266" fill="#fefefe">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#fefefe" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#000000" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#b60c70" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#17a278" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#a89a16" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#068abb" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#58437a" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#469daf" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#fdfdfd" stroke="#fefefe" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#fefefe" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#000000" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#cc0076" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#10a579" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#a69d10" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#008ec3" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#5f4e80" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#1aa7b4" stroke="#fefefe" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#fefefe" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>