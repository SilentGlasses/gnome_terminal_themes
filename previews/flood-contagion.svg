<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#14110e" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#14110e"/>
  <rect x="0" y="26" width="700" height="10" fill="#14110e"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#e6e1d6" text-anchor="middle" opacity="0.7">Flood Contagion</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#e6e1d6" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#e6e1d6">
      <tspan x="0" y="20" fill="#6e7f4a">❯</tspan>
      <tspan fill="#e6e1d6"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#5e7f82">OS</tspan>
      <tspan fill="#e6e1d6" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e6e1d6">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#9a8a4a">⚙</tspan>
      <tspan fill="#e6e1d6" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e6e1d6">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#6a4a5e">📦</tspan>
      <tspan fill="#e6e1d6" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e6e1d6">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#7c2f2a">🐚</tspan>
      <tspan fill="#e6e1d6" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e6e1d6">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#4a6b70">🖥</tspan>
      <tspan fill="#e6e1d6" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e6e1d6">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#6e7f4a">🎨</tspan>
      <tspan fill="#e6e1d6" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e6e1d6">Flood Contagion</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#2a2621"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#4a6b70">function</tspan>
      <tspan fill="#9a8a4a"> greet</tspan>
      <tspan fill="#e6e1d6">() {</tspan>
      <tspan x="0" y="244" fill="#e6e1d6">    </tspan>
      <tspan fill="#4a6b70">echo</tspan>
      <tspan fill="#e6e1d6"> </tspan>
      <tspan fill="#6e7f4a">"Hello, </tspan>
      <tspan fill="#5e7f82">$USER</tspan>
      <tspan fill="#6e7f4a">!"</tspan>
      <tspan x="0" y="266" fill="#e6e1d6">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#e6e1d6" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#14110e" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#7c2f2a" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#6e7f4a" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#9a8a4a" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#4a6b70" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#6a4a5e" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#5e7f82" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e6e1d6" stroke="#e6e1d6" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#e6e1d6" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#2a2621" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#a84740" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#8fa05e" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#c2b66a" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#6fa3a6" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#8c6a82" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#8fb7ba" stroke="#e6e1d6" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#ffffff" stroke="#e6e1d6" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>