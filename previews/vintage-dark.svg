<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#31363f" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#31363f"/>
  <rect x="0" y="26" width="700" height="10" fill="#31363f"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#f7efdc" text-anchor="middle" opacity="0.7">Vintage Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#f7efdc" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#f7efdc">
      <tspan x="0" y="20" fill="#adc45d">❯</tspan>
      <tspan fill="#f7efdc"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#8bc5be">OS</tspan>
      <tspan fill="#f7efdc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f7efdc">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#edd364">⚙</tspan>
      <tspan fill="#f7efdc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f7efdc">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#d7a0d6">📦</tspan>
      <tspan fill="#f7efdc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f7efdc">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#ff948a">🐚</tspan>
      <tspan fill="#f7efdc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f7efdc">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#8a9ec9">🖥</tspan>
      <tspan fill="#f7efdc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f7efdc">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#adc45d">🎨</tspan>
      <tspan fill="#f7efdc" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f7efdc">Vintage Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#6e7887"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#8a9ec9">function</tspan>
      <tspan fill="#edd364"> greet</tspan>
      <tspan fill="#f7efdc">() {</tspan>
      <tspan x="0" y="244" fill="#f7efdc">    </tspan>
      <tspan fill="#8a9ec9">echo</tspan>
      <tspan fill="#f7efdc"> </tspan>
      <tspan fill="#adc45d">"Hello, </tspan>
      <tspan fill="#8bc5be">$USER</tspan>
      <tspan fill="#adc45d">!"</tspan>
      <tspan x="0" y="266" fill="#f7efdc">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#f7efdc" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#222831" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff948a" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#adc45d" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#edd364" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#8a9ec9" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#d7a0d6" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#8bc5be" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f7efdc" stroke="#f7efdc" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#f7efdc" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#6e7887" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ffafa5" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#c3dc7d" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#fae687" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#aabee1" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#ebbeeb" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#aadcd7" stroke="#f7efdc" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#fffaeb" stroke="#f7efdc" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>