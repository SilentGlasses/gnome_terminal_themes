<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#0f111a" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#0f111a"/>
  <rect x="0" y="26" width="700" height="10" fill="#0f111a"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#e5e9f0" text-anchor="middle" opacity="0.7">Liquid Glass Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#e5e9f0" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#e5e9f0">
      <tspan x="0" y="20" fill="#32d74b">❯</tspan>
      <tspan fill="#e5e9f0"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#64d2ff">OS</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#ffd60a">⚙</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#bf5af2">📦</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#ff453a">🐚</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#0a84ff">🖥</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#32d74b">🎨</tspan>
      <tspan fill="#e5e9f0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#e5e9f0">Liquid Glass Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#2c2f3a"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#0a84ff">function</tspan>
      <tspan fill="#ffd60a"> greet</tspan>
      <tspan fill="#e5e9f0">() {</tspan>
      <tspan x="0" y="244" fill="#e5e9f0">    </tspan>
      <tspan fill="#0a84ff">echo</tspan>
      <tspan fill="#e5e9f0"> </tspan>
      <tspan fill="#32d74b">"Hello, </tspan>
      <tspan fill="#64d2ff">$USER</tspan>
      <tspan fill="#32d74b">!"</tspan>
      <tspan x="0" y="266" fill="#e5e9f0">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#e5e9f0" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#1a1c24" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff453a" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#32d74b" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffd60a" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#0a84ff" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#bf5af2" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#64d2ff" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#d0d3dc" stroke="#e5e9f0" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#e5e9f0" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#2c2f3a" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff6b61" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#5cd97a" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffe055" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#409cff" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#dda6ff" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#8beaff" stroke="#e5e9f0" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f5f7fa" stroke="#e5e9f0" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>