name: Theme Preview Generator

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'themes/*.sh'
  push:
    branches: [main]
    paths:
      - 'themes/*.sh'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-previews:
    name: Generate Theme Previews
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate all previews and update README
        run: |
          python3 .github/scripts/generate_preview.py --all --update-readme

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v6
        with:
          name: theme-previews
          path: previews/*.svg
          if-no-files-found: ignore

      # On push to main, create PR with preview updates (respects branch protection)
      - name: Create Pull Request for preview updates
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: update theme previews

            Co-Authored-By: Warp <agent@warp.dev>
          branch: chore/update-theme-previews
          delete-branch: true
          title: "chore: update theme previews"
          body: |
            This PR updates theme preview images after changes to theme files.

            Auto-generated by the Theme Preview Generator workflow.
          labels: automated,previews

      # On PR, comment with preview of changed themes
      - name: Get changed theme files
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'themes/*.sh' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: Comment on PR with previews
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Get changed files
            const changedFiles = '${{ steps.changed.outputs.files }}'.trim().split(' ').filter(f => f);
            const changedSlugs = changedFiles.map(f => path.basename(f, '.sh'));

            const previewDir = 'previews';
            let comment = '## Theme Preview\n\n';
            comment += `Previews for ${changedSlugs.length} changed theme(s) in this PR:\n\n`;

            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const branch = context.payload.pull_request.head.ref;

            if (fs.existsSync(previewDir)) {
              const previewsFound = [];

              for (const slug of changedSlugs) {
                const file = `${slug}.svg`;
                const filePath = path.join(previewDir, file);

                if (fs.existsSync(filePath)) {
                  const themeName = slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                  // Link to raw file in the PR branch
                  const rawUrl = `${repoUrl}/raw/${branch}/previews/${file}`;
                  previewsFound.push({ name: themeName, url: rawUrl, slug });
                }
              }

              if (previewsFound.length > 0) {
                // Show previews as linked images (renders in GitHub)
                for (const preview of previewsFound) {
                  comment += `### ${preview.name}\n`;
                  comment += `<img src="${preview.url}" alt="${preview.name}" width="700">\n\n`;
                }
              } else {
                comment += 'Preview files will be generated after merge.\n';
              }

              comment += '\n<details>\n<summary>About previews</summary>\n\n';
              comment += 'These previews are auto-generated and show how the theme colors will appear in GNOME Terminal.\n';
              comment += 'Once merged, previews will be committed to the `previews/` folder and added to the README.\n';
              comment += '</details>';
            } else {
              comment += 'No preview files found. Previews will be generated after merge.';
            }

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Theme Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
