<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#1c1c3f" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#1c1c3f"/>
  <rect x="0" y="26" width="700" height="10" fill="#1c1c3f"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#dcdce0" text-anchor="middle" opacity="0.7">Ethereal Galaxy Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#dcdce0" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#dcdce0">
      <tspan x="0" y="20" fill="#a4cc35">❯</tspan>
      <tspan fill="#dcdce0"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#26c99e">OS</tspan>
      <tspan fill="#dcdce0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcdce0">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#ffd24a">⚙</tspan>
      <tspan fill="#dcdce0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcdce0">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#f28144">📦</tspan>
      <tspan fill="#dcdce0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcdce0">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#bf65f0">🐚</tspan>
      <tspan fill="#dcdce0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcdce0">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#f553bf">🖥</tspan>
      <tspan fill="#dcdce0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcdce0">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#a4cc35">🎨</tspan>
      <tspan fill="#dcdce0" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#dcdce0">Ethereal Galaxy Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#373756"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#f553bf">function</tspan>
      <tspan fill="#ffd24a"> greet</tspan>
      <tspan fill="#dcdce0">() {</tspan>
      <tspan x="0" y="244" fill="#dcdce0">    </tspan>
      <tspan fill="#f553bf">echo</tspan>
      <tspan fill="#dcdce0"> </tspan>
      <tspan fill="#a4cc35">"Hello, </tspan>
      <tspan fill="#26c99e">$USER</tspan>
      <tspan fill="#a4cc35">!"</tspan>
      <tspan x="0" y="266" fill="#dcdce0">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#dcdce0" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#1c1c3f" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#bf65f0" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#a4cc35" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffd24a" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#f553bf" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#f28144" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#26c99e" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#c1c1c9" stroke="#dcdce0" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#dcdce0" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#373756" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#66bfff" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#26c99e" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffd24a" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#f553bf" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#f28144" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#26c99e" stroke="#dcdce0" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#dcdce0" stroke="#dcdce0" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>