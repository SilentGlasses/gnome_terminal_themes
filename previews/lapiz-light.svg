<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#f1f1f1" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#f1f1f1"/>
  <rect x="0" y="26" width="700" height="10" fill="#f1f1f1"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#424242" text-anchor="middle" opacity="0.7">Lapiz Light</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#424242" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#424242">
      <tspan x="0" y="20" fill="#10a778">❯</tspan>
      <tspan fill="#424242"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#20a5ba">OS</tspan>
      <tspan fill="#424242" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#424242">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#a89c14">⚙</tspan>
      <tspan fill="#424242" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#424242">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#523c79">📦</tspan>
      <tspan fill="#424242" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#424242">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#c30771">🐚</tspan>
      <tspan fill="#424242" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#424242">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#008ec4">🖥</tspan>
      <tspan fill="#424242" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#424242">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#10a778">🎨</tspan>
      <tspan fill="#424242" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#424242">Lapiz Light</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#212121"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#008ec4">function</tspan>
      <tspan fill="#a89c14"> greet</tspan>
      <tspan fill="#424242">() {</tspan>
      <tspan x="0" y="244" fill="#424242">    </tspan>
      <tspan fill="#008ec4">echo</tspan>
      <tspan fill="#424242"> </tspan>
      <tspan fill="#10a778">"Hello, </tspan>
      <tspan fill="#20a5ba">$USER</tspan>
      <tspan fill="#10a778">!"</tspan>
      <tspan x="0" y="266" fill="#424242">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#424242" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#212121" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#c30771" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#10a778" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#a89c14" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#008ec4" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#523c79" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#20a5ba" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#e0e0e0" stroke="#424242" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#424242" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#212121" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#fb007a" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#5fd7af" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#f3e430" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#20bbfc" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#6855de" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#4fb8cc" stroke="#424242" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#f1f1f1" stroke="#424242" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>