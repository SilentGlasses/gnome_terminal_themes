<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#222c32" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#222c32"/>
  <rect x="0" y="26" width="700" height="10" fill="#222c32"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#fafefe" text-anchor="middle" opacity="0.7">Material Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#fafefe" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#fafefe">
      <tspan x="0" y="20" fill="#b0f6c3">❯</tspan>
      <tspan fill="#fafefe"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#9bfce4">OS</tspan>
      <tspan fill="#fafefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fafefe">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#fbdf74">⚙</tspan>
      <tspan fill="#fafefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fafefe">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#fc73a1">📦</tspan>
      <tspan fill="#fafefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fafefe">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#fd8075">🐚</tspan>
      <tspan fill="#fafefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fafefe">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#74d3f7">🖥</tspan>
      <tspan fill="#fafefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fafefe">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#b0f6c3">🎨</tspan>
      <tspan fill="#fafefe" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#fafefe">Material Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#49646f"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#74d3f7">function</tspan>
      <tspan fill="#fbdf74"> greet</tspan>
      <tspan fill="#fafefe">() {</tspan>
      <tspan x="0" y="244" fill="#fafefe">    </tspan>
      <tspan fill="#74d3f7">echo</tspan>
      <tspan fill="#fafefe"> </tspan>
      <tspan fill="#b0f6c3">"Hello, </tspan>
      <tspan fill="#9bfce4">$USER</tspan>
      <tspan fill="#b0f6c3">!"</tspan>
      <tspan x="0" y="266" fill="#fafefe">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#fafefe" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#49646f" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#fd8075" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#b0f6c3" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#fbdf74" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#74d3f7" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#fc73a1" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#9bfce4" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#fafefe" stroke="#fafefe" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#fafefe" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#49646f" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#fd8075" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#b0f6c3" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#fbdf74" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#74d3f7" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#fc73a1" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#9bfce4" stroke="#fafefe" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#fafefe" stroke="#fafefe" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>