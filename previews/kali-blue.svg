<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#151c24" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#151c24"/>
  <rect x="0" y="26" width="700" height="10" fill="#151c24"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#92d3d8" text-anchor="middle" opacity="0.7">Kali Blue</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#92d3d8" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#92d3d8">
      <tspan x="0" y="20" fill="#25718c">❯</tspan>
      <tspan fill="#92d3d8"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#33a9b8">OS</tspan>
      <tspan fill="#92d3d8" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#92d3d8">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#627c85">⚙</tspan>
      <tspan fill="#92d3d8" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#92d3d8">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#2e93a9">📦</tspan>
      <tspan fill="#92d3d8" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#92d3d8">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#575e61">🐚</tspan>
      <tspan fill="#92d3d8" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#92d3d8">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#2a859a">🖥</tspan>
      <tspan fill="#92d3d8" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#92d3d8">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#25718c">🎨</tspan>
      <tspan fill="#92d3d8" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#92d3d8">Kali Blue</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#010305"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#2a859a">function</tspan>
      <tspan fill="#627c85"> greet</tspan>
      <tspan fill="#92d3d8">() {</tspan>
      <tspan x="0" y="244" fill="#92d3d8">    </tspan>
      <tspan fill="#2a859a">echo</tspan>
      <tspan fill="#92d3d8"> </tspan>
      <tspan fill="#25718c">"Hello, </tspan>
      <tspan fill="#33a9b8">$USER</tspan>
      <tspan fill="#25718c">!"</tspan>
      <tspan x="0" y="266" fill="#92d3d8">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#92d3d8" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#010305" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#575e61" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#25718c" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#627c85" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#2a859a" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#2e93a9" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#33a9b8" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#92d3d8" stroke="#92d3d8" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#92d3d8" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#010305" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#575e61" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#25718c" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#627c85" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#2a859a" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#2e93a9" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#33a9b8" stroke="#92d3d8" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#92d3d8" stroke="#92d3d8" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>