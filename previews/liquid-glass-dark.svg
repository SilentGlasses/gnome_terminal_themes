<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Terminal window -->
  <rect x="0" y="0" width="700" height="420" rx="10" fill="#16161e" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="0" y="0" width="700" height="36" rx="10" fill="#16161e"/>
  <rect x="0" y="26" width="700" height="10" fill="#16161e"/>
  
  <!-- Window controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27ca40"/>
  
  <!-- Title -->
  <text x="350" y="22" font-family="monospace" font-size="12" fill="#f0f0f5" text-anchor="middle" opacity="0.7">Liquid Glass Dark</text>
  
  <!-- Separator line -->
  <line x1="0" y1="36" x2="700" y2="36" stroke="#f0f0f5" stroke-opacity="0.2"/>
  
  <!-- Content area -->
  <g transform="translate(20, 50)">
    <!-- Sample prompt and commands -->
    <text font-family="monospace" font-size="14" fill="#f0f0f5">
      <tspan x="0" y="20" fill="#7ee787">❯</tspan>
      <tspan fill="#f0f0f5"> fastfetch</tspan>
    </text>
    
    <!-- System info block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="50" fill="#87e1f5">OS</tspan>
      <tspan fill="#f0f0f5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f0f0f5">Ubuntu 24.04 LTS x86_64</tspan>
      
      <tspan x="0" y="72" fill="#ffd460">⚙</tspan>
      <tspan fill="#f0f0f5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f0f0f5">Linux 6.17.0-14-generic</tspan>
      
      <tspan x="0" y="94" fill="#d2a0ff">📦</tspan>
      <tspan fill="#f0f0f5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f0f0f5">1931 (dpkg), 11 (snap)</tspan>
      
      <tspan x="0" y="116" fill="#ff6961">🐚</tspan>
      <tspan fill="#f0f0f5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f0f0f5">zsh 5.9</tspan>
      
      <tspan x="0" y="138" fill="#78afff">🖥</tspan>
      <tspan fill="#f0f0f5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f0f0f5">GNOME Terminal 3.52.0</tspan>
      
      <tspan x="0" y="160" fill="#7ee787">🎨</tspan>
      <tspan fill="#f0f0f5" opacity="0.5"> -&gt; </tspan>
      <tspan fill="#f0f0f5">Liquid Glass Dark</tspan>
    </text>
    
    <!-- Sample code block -->
    <text font-family="monospace" font-size="13">
      <tspan x="0" y="200" fill="#464655"># Sample syntax highlighting</tspan>
      <tspan x="0" y="222" fill="#78afff">function</tspan>
      <tspan fill="#ffd460"> greet</tspan>
      <tspan fill="#f0f0f5">() {</tspan>
      <tspan x="0" y="244" fill="#f0f0f5">    </tspan>
      <tspan fill="#78afff">echo</tspan>
      <tspan fill="#f0f0f5"> </tspan>
      <tspan fill="#7ee787">"Hello, </tspan>
      <tspan fill="#87e1f5">$USER</tspan>
      <tspan fill="#7ee787">!"</tspan>
      <tspan x="0" y="266" fill="#f0f0f5">}</tspan>
    </text>
    
    <!-- Color palette circles - Normal colors -->
    <g transform="translate(0, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#f0f0f5" opacity="0.6">Normal</text>
      <circle cx="12" cy="18" r="12" fill="#23232d" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff6961" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#7ee787" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffd460" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#78afff" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#d2a0ff" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#87e1f5" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#dcdce6" stroke="#f0f0f5" stroke-opacity="0.2"/>
    </g>
    
    <!-- Color palette circles - Bright colors -->
    <g transform="translate(320, 290)">
      <text x="0" y="-5" font-family="monospace" font-size="11" fill="#f0f0f5" opacity="0.6">Bright</text>
      <circle cx="12" cy="18" r="12" fill="#464655" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="48" cy="18" r="12" fill="#ff8c82" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="84" cy="18" r="12" fill="#a0f0aa" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="120" cy="18" r="12" fill="#ffe48c" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="156" cy="18" r="12" fill="#a0c8ff" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="192" cy="18" r="12" fill="#e6beff" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="228" cy="18" r="12" fill="#aaf0ff" stroke="#f0f0f5" stroke-opacity="0.2"/>
      <circle cx="264" cy="18" r="12" fill="#fafaff" stroke="#f0f0f5" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>